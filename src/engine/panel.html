<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SteelSeries GG</title>
<style>
:root {
  --bg: #121214; --panel: #1b1b1f; --panel2: #232328; --line: #2e2e35; --text: #ececf1;
  --muted: #9a9aa6; --accent: #ff6a13; --accent2: #ff8f4d; --ok: #3ccf7a; --warn: #f5b942; --bad: #ff5d5d;
  --radius: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif; }
button, input, select { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
nav { background: #0d0d0f; border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-weight: 700; letter-spacing: .3px; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), #ff3d00); display: grid; place-items: center; font-size: 13px; color: #fff; }
.tab { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; color: var(--muted); cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.tab:hover { background: var(--panel); color: var(--text); }
.tab.active { background: var(--panel2); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
.tab svg { width: 18px; height: 18px; flex: none; }
.nav-foot { margin-top: auto; padding: 10px; font-size: 12px; color: var(--muted); }
main { padding: 26px 30px 60px; overflow: auto; min-width: 0; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
.sub { color: var(--muted); margin: 0 0 22px; }
.banner { background: #2a1f12; border: 1px solid #5a3b14; color: #ffd8a8; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; }
.banner.bad { background: #2a1414; border-color: #5a1f1f; color: #ffc4c4; }
.grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.card + .card { margin-top: 16px; }
.devices { display: flex; flex-direction: column; gap: 10px; }
.device { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; text-align: left; width: 100%; }
.device:hover { border-color: #46464f; }
.device.active { border-color: var(--accent); background: #22191380; }
.device-icon { width: 38px; height: 38px; border-radius: 9px; background: var(--panel2); display: grid; place-items: center; flex: none; }
.device-icon svg { width: 22px; height: 22px; color: var(--accent2); }
.device-name { font-weight: 600; }
.device-meta { color: var(--muted); font-size: 12px; }
.battery { display: inline-flex; align-items: center; gap: 6px; }
.battery-bar { width: 26px; height: 11px; border: 1.5px solid currentColor; border-radius: 3px; position: relative; }
.battery-bar i { position: absolute; left: 1px; top: 1px; bottom: 1px; border-radius: 1px; background: currentColor; }
.row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row-label { width: 200px; flex: none; }
.row-label b { display: block; font-weight: 600; }
.row-label small { color: var(--muted); }
.row-control { flex: 1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
.badge.ref { color: var(--warn); border-color: #6b5520; }
.badge.guess { color: var(--bad); border-color: #6b2525; }
input[type=range] { flex: 1; min-width: 140px; accent-color: var(--accent); }
.num { width: 64px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
select, input[type=text], input[type=number] { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
input[type=number] { width: 90px; }
input[type=color] { width: 40px; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); padding: 2px; cursor: pointer; }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
.btn:hover { border-color: #55555f; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { background: var(--accent2); }
.btn.danger { color: #ffb4b4; }
.btn:disabled { opacity: .5; cursor: default; }
.seg { display: inline-flex; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--accent); color: #fff; }
.switch { position: relative; width: 42px; height: 24px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: #3a3a42; border-radius: 999px; transition: .15s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.eq { display: flex; gap: 12px; align-items: flex-end; padding: 6px 0; overflow-x: auto; }
.eq-band { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.eq-band input[type=range] { writing-mode: vertical-lr; direction: rtl; height: 120px; width: 24px; min-width: 0; flex: none; }
.dpi { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.zones { display: flex; gap: 12px; flex-wrap: wrap; }
.zone { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.buttons-map { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; width: 100%; }
.profiles { display: flex; flex-direction: column; gap: 10px; }
.profile { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.profile.active { border-color: var(--accent); }
.profile-main { flex: 1; min-width: 0; }
.profile-main small { color: var(--muted); display: block; }
.pill { font-size: 11px; background: var(--accent); color: #fff; padding: 2px 8px; border-radius: 999px; }
.empty { color: var(--muted); padding: 30px; text-align: center; border: 1px dashed var(--line); border-radius: var(--radius); }
.toast { position: fixed; right: 20px; bottom: 20px; background: #26262c; border: 1px solid var(--line); padding: 10px 14px; border-radius: 10px; max-width: 420px; box-shadow: 0 8px 24px #0008; opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
.toast.err { border-color: #6b2525; color: #ffc4c4; }
.muted { color: var(--muted); }
.kv { display: grid; grid-template-columns: 160px 1fr; gap: 8px 14px; }
.oled-preview { width: 100%; max-width: 512px; aspect-ratio: 128 / 40; image-rendering: pixelated; background: #000; border: 1px solid var(--line); border-radius: 8px; display: block; }
input[type=file] { color: var(--muted); }
input[type=file]::file-selector-button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; margin-right: 12px; cursor: pointer; }
textarea { width: 100%; min-height: 72px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: inherit; font: inherit; resize: vertical; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  nav { flex-direction: row; flex-wrap: wrap; padding: 10px; }
  .brand { width: 100%; padding-bottom: 8px; }
  .tab { width: auto; }
  .nav-foot { display: none; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  main { padding: 18px 16px 50px; }
  .row { flex-direction: column; align-items: stretch; }
  .row-label { width: auto; }
}
</style>
</head>
<body>
<div class="app">
  <nav id="nav">
    <div class="brand"><div class="brand-mark">GG</div><div>SteelSeries GG</div></div>
    <button class="tab" data-tab="devices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="20" height="11" rx="2"/><path d="M6 11h.01M10 11h.01M14 11h.01M18 11h.01M7 15h10"/></svg>Devices</button>
    <button class="tab" data-tab="lighting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Lighting</button>
    <button class="tab" data-tab="profiles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Profiles</button>
    <button class="tab" data-tab="audio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg>Audio</button>
    <button class="tab" data-tab="bindings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/><path d="M11 7h4a2 2 0 0 1 2 2v4"/></svg>Key bindings</button>
    <button class="tab" data-tab="screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="11" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>Screen</button>
    <button class="tab" data-tab="moments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>Moments</button>
    <button class="tab" data-tab="about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>About</button>
    <div class="nav-foot" id="navFoot"></div>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
'use strict';
// ---------- transport ----------
const params = new URLSearchParams(location.hash.slice(1));
const DEMO = params.has('demo');
let token = params.get('token') || sessionStorage.getItem('ssgg-token');
if (params.get('token')) { sessionStorage.setItem('ssgg-token', token); history.replaceState(null, '', DEMO ? '/#demo' : '/'); }
// `ssgg ui` passes a one-time ticket (program arguments are visible to other users); trade it once.
const ticketReady = (async () => {
  const ticket = params.get('ticket');
  if (!ticket) return;
  history.replaceState(null, '', '/');
  try {
    const r = await fetch('/api/redeem', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ticket }) });
    const j = await r.json();
    if (j.ok) { token = j.data.token; sessionStorage.setItem('ssgg-token', token); }
    else state.error = 'This link was already used or expired. Run `ssgg ui` again.';
  } catch (e) { state.error = e.message; }
})();

async function call(cmd) {
  if (DEMO) return demoCall(cmd);
  const r = await fetch('/api/command', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify(cmd) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}

// ---------- helpers ----------
const $ = (sel, root = document) => root.querySelector(sel);
function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of children.flat(Infinity)) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}
function fill(node, ...kids) { node.replaceChildren(...kids.flat(Infinity).filter(k => k != null && k !== false)); }
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.className = 'toast', 3200);
}
async function run(cmd, okMsg) {
  try { const d = await call(cmd); if (okMsg) toast(okMsg); return d; }
  catch (e) { toast(e.message, true); throw e; }
}
const hex = c => '#' + [c.r, c.g, c.b].map(v => v.toString(16).padStart(2, '0')).join('');
const rgb = h => ({ r: parseInt(h.slice(1, 3), 16), g: parseInt(h.slice(3, 5), 16), b: parseInt(h.slice(5, 7), 16) });
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const ICONS = {
  Keyboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="20" height="11" rx="2"/><path d="M6 11h.01M10 11h.01M14 11h.01M18 11h.01M7 15h10"/></svg>',
  Mouse: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="6"/><path d="M12 7v4"/></svg>',
  Headset: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>',
};
function iconFor(kind) { const s = el('div', { class: 'device-icon' }); s.innerHTML = ICONS[kind] || ICONS.Keyboard; return s; }
function batteryView(st) {
  if (st.battery_percent == null) return null;
  const p = st.battery_percent, color = p <= 15 ? 'var(--bad)' : p <= 30 ? 'var(--warn)' : 'var(--ok)';
  const bar = el('span', { class: 'battery-bar' }, el('i', { style: `width:calc(${p}% - 2px)` }));
  return el('span', { class: 'battery', style: `color:${color}` }, bar, `${p}%${st.charging ? ' ⚡' : ''}`);
}

// ---------- state ----------
const VIEWS_ORDER = ['devices', 'lighting', 'audio', 'bindings', 'profiles', 'screen', 'moments', 'about'];
let state = { snapshot: null, selected: params.get('device'), tab: VIEWS_ORDER.includes(params.get('tab')) ? params.get('tab') : 'devices' };

async function refresh() {
  try {
    state.snapshot = await call({ cmd: 'status' });
    if (!state.selected || !state.snapshot.devices.some(d => d.key === state.selected)) state.selected = state.snapshot.devices[0]?.key || null;
    $('#navFoot').textContent = `v${state.snapshot.version}${DEMO ? ' · demo' : ''}`;
  } catch (e) {
    state.snapshot = null; state.error = e.message;
  }
}

// ---------- views ----------
function header(title, sub) { return [el('h1', {}, title), el('p', { class: 'sub' }, sub)]; }

function banners() {
  const out = [];
  if (!token && !DEMO) out.push(el('div', { class: 'banner bad' }, 'Open this page with ', el('code', {}, 'ssgg ui'), ' so it can talk to the daemon.'));
  if (DEMO) out.push(el('div', { class: 'banner' }, 'Demo mode: these devices are simulated. Nothing is sent to hardware.'));
  if (state.error && !state.snapshot) out.push(el('div', { class: 'banner bad' }, state.error));
  for (const w of state.snapshot?.warnings || []) out.push(el('div', { class: 'banner' }, w));
  return out;
}

async function viewDevices() {
  const snap = state.snapshot;
  const main = [...header('Devices', 'Everything connected, with its settings.'), ...banners()];
  if (!snap || !snap.devices.length) {
    main.push(el('div', { class: 'empty' }, 'No SteelSeries devices connected. Plug one in — the list updates by itself.'));
    return main;
  }
  const list = el('div', { class: 'devices' }, snap.devices.map(d => el('button', {
    class: 'device' + (d.key === state.selected ? ' active' : ''),
    onclick: () => { state.selected = d.key; render(); },
  }, iconFor(d.kind), el('div', {}, el('div', { class: 'device-name' }, d.name), el('div', { class: 'device-meta' }, batteryView(d.status) || d.kind)))));
  const dev = snap.devices.find(d => d.key === state.selected);
  const detail = el('div', {});
  main.push(el('div', { class: 'grid' }, list, detail));
  if (dev) await fillDevice(detail, dev);
  return main;
}

async function fillDevice(root, dev) {
  const st = dev.status, facts = [];
  if (st.battery_percent != null) facts.push(['Battery', batteryView(st)]);
  if (st.chatmix) facts.push(['ChatMix', `Game ${st.chatmix.game}% · Chat ${st.chatmix.chat}%`]);
  if (st.wireless_connected === false) facts.push(['Connection', 'Headset off or out of range']);
  if (st.mic_muted != null) facts.push(['Microphone', st.mic_muted ? 'Muted' : 'Live']);
  for (const [k, v] of Object.entries(st.extra || {})) facts.push([k, v]);
  const info = el('div', { class: 'card' }, el('h2', {}, dev.name),
    el('div', { class: 'kv' }, el('span', { class: 'muted' }, 'Device key'), el('code', {}, dev.key),
      facts.map(([k, v]) => [el('span', { class: 'muted' }, k), el('span', {}, v)])));
  root.append(info);
  if (dev.lighting) root.append(lightingCard(dev));
  let view;
  try { view = await call({ cmd: 'settings', device: dev.key }); } catch (e) { root.append(el('div', { class: 'card' }, e.message)); return; }
  if (view.settings.length) {
    const card = el('div', { class: 'card' }, el('h2', {}, 'Settings'));
    for (const entry of view.settings) card.append(settingRow(dev.key, entry));
    card.append(el('p', { class: 'muted', style: 'margin:14px 0 0;font-size:12px' }, 'Untested = from a published open-source driver; Guess = extrapolated. Neither was tried on this hardware.'));
    root.append(card);
  }
}

function verificationBadge(v) {
  if (v === 'reference') return el('span', { class: 'badge ref', title: 'Byte layout from a published open-source driver; not tried on hardware by this project' }, 'untested');
  if (v === 'guess') return el('span', { class: 'badge guess', title: 'Extrapolated from a similar model' }, 'guess');
  return null;
}

function settingRow(device, entry) {
  const d = entry.descriptor, k = d.kind, v = entry.value;
  const send = value => run({ cmd: 'set', device, setting: d.id, value }, `${d.label} updated`);
  const sendLater = debounce(send, 250);
  const control = el('div', { class: 'row-control' });
  const cur = v ? Object.values(v)[0] : undefined;
  switch (k.type) {
    case 'range': {
      const num = el('span', { class: 'num' }, `${cur ?? k.min}${k.unit || ''}`);
      control.append(el('input', { type: 'range', min: k.min, max: k.max, step: k.step, value: cur ?? k.min,
        oninput: e => { num.textContent = e.target.value + (k.unit || ''); sendLater({ int: +e.target.value }); } }), num);
      break;
    }
    case 'choice': {
      if (k.options.length <= 5) {
        const seg = el('div', { class: 'seg' });
        for (const o of k.options) seg.append(el('button', { class: o.id === cur ? 'on' : '', onclick: e => {
          [...seg.children].forEach(b => b.classList.remove('on')); e.target.classList.add('on'); send({ choice: o.id }); } }, o.label));
        control.append(seg);
      } else {
        control.append(el('select', { onchange: e => send({ choice: e.target.value }) },
          k.options.map(o => el('option', { value: o.id, selected: o.id === cur }, o.label))));
      }
      break;
    }
    case 'toggle':
      control.append(el('label', { class: 'switch' }, el('input', { type: 'checkbox', checked: !!cur, onchange: e => send({ bool: e.target.checked }) }), el('span')));
      break;
    case 'color':
      control.append(el('input', { type: 'color', value: cur ? hex(cur) : '#ff6a13', oninput: e => sendLater({ color: rgb(e.target.value) }) }));
      break;
    case 'color_zones': {
      const colors = (cur && cur.length === k.zones.length) ? cur.map(hex) : k.zones.map((_, i) => cur?.[0] ? hex(cur[0]) : '#ff6a13');
      const wrap = el('div', { class: 'zones' });
      k.zones.forEach((z, i) => wrap.append(el('label', { class: 'zone' }, el('input', { type: 'color', value: colors[i],
        oninput: e => { colors[i] = e.target.value; sendLater({ colors: colors.map(rgb) }); } }), z)));
      control.append(wrap);
      break;
    }
    case 'dpi_stages': {
      let stages = Array.isArray(cur) && cur.length ? [...cur] : [800, 1600];
      const wrap = el('div', { class: 'dpi' });
      const draw = () => {
        fill(wrap, ...stages.map((s, i) => el('input', { type: 'number', min: k.min, max: k.max, step: k.step, value: s,
          onchange: e => { stages[i] = +e.target.value; send({ dpi: stages }); } })),
          el('button', { class: 'btn', disabled: stages.length >= k.max_stages, onclick: () => { stages.push(stages[stages.length - 1]); draw(); send({ dpi: stages }); } }, '+'),
          el('button', { class: 'btn', disabled: stages.length <= 1, onclick: () => { stages.pop(); draw(); send({ dpi: stages }); } }, '−'));
      };
      draw(); control.append(wrap, el('span', { class: 'muted' }, `${k.min}–${k.max}, step ${k.step}`));
      break;
    }
    case 'equalizer': {
      const gains = Array.isArray(cur) && cur.length === k.bands_hz.length ? [...cur] : k.bands_hz.map(() => 0);
      const eq = el('div', { class: 'eq' });
      k.bands_hz.forEach((hz, i) => {
        const val = el('span', {}, `${gains[i] > 0 ? '+' : ''}${gains[i]}`);

// 1-bit conversion for the 128x40 keyboard screen: fit, grayscale, dither, pack MSB-first rows.

  }

const ACTION_TYPES = [['key', 'Key', 'e.g. ctrl, KEY_A, mouse4'], ['combo', 'Key combination', 'e.g. ctrl+shift+t'], ['text', 'Type text', 'Text to type'], ['launch', 'Launch program', 'e.g. firefox --new-window'],
  ['media', 'Media key', 'play_pause, next, previous, volume_up, volume_down, mute'], ['mouse', 'Mouse button', 'left, right, middle, side, extra'], ['profile', 'Switch profile', 'Profile name'], ['disabled', 'Disable key', '']];
function buildAction(type, value) {
  switch (type) {
    case 'key': return { key: value };
    case 'combo': return { combo: value.split('+').map(s => s.trim()).filter(Boolean) };
    case 'text': return { text: value.replace(/\\n/g, '\n') };
    case 'launch': { const [command, ...args] = value.trim().split(/\s+/); return { launch: { command, args } }; }
    case 'media': return { media: value };
    case 'mouse': return { mouse_button: value };
    case 'profile': return { switch_profile: value };
    default: return 'disabled';
  }
}
function describeAction(a) {
  if (typeof a === 'string') return a === 'disabled' ? 'Disabled' : 'Normal';
  const [k, v] = Object.entries(a)[0];
  switch (k) {
    case 'key': return `Key ${v}`;
    case 'combo': return `Combination ${v.join(' + ')}`;
    case 'text': return `Types "${v}"`;
    case 'launch': return `Launches ${v.command} ${(v.args || []).join(' ')}`;
    case 'media': return `Media: ${v}`;
    case 'mouse_button': return `Mouse ${v}`;
    case 'switch_profile': return `Switches to profile ${v}`;
    case 'macro': return `Macro (${v.steps.length} steps${v.repeat > 1 ? ', ×' + v.repeat : ''})`;
    default: return k;
  }
}

async function demoCall(cmd) {
  await new Promise(r => setTimeout(r, 60));
  const find = sel => demo.devices.find(d => d.key === sel) || (() => { throw new Error(`no device ${sel}`); })();
  switch (cmd.cmd) {
    case 'status': case 'refresh': return demoSnapshot();
    case 'settings': { const d = find(cmd.device); return { device: d.key, name: d.name, settings: d.settings }; }
    case 'set': { const d = find(cmd.device); const s = d.settings.find(s => s.descriptor.id === cmd.setting); if (cmd.value !== 'trigger') s.value = cmd.value; return { device: d.key, setting: cmd.setting }; }
    case 'lighting': {
      if (!cmd.device) { if (cmd.effect) demo.lighting.effect = cmd.effect; if (cmd.brightness != null) demo.lighting.brightness = cmd.brightness; }
      else { const d = find(cmd.device); if (cmd.follow_global) d.own = null; else { d.own = d.own || JSON.parse(JSON.stringify(demo.lighting)); if (cmd.effect) d.own.effect = cmd.effect; if (cmd.brightness != null) d.own.brightness = cmd.brightness; } }
      return demoSnapshot();
    }
    case 'profile_list': return demo.profiles;
    case 'profile_save': if (!demo.profiles.some(p => p.name === cmd.name)) demo.profiles.push({ name: cmd.name, description: null, apps: [], active: false }); return { saved: cmd.name };
    case 'profile_pull': demo.profiles.push({ name: cmd.name || 'Config 3', description: 'read from the keyboard's own memory of Apex 7', apps: [], active: false }); return { profile: cmd.name || 'Config 3', name: 'Config 3', bindings: 2 };
    case 'profile_load': demo.profiles.forEach(p => p.active = p.name === cmd.name); return demoSnapshot();
    case 'profile_delete': demo.profiles = demo.profiles.filter(p => p.name !== cmd.name); return { deleted: cmd.name };
    case 'profile_apps': demo.profiles.find(p => p.name === cmd.name).apps = cmd.apps; return { profile: cmd.name };
    case 'oled': if (cmd.idle) demo.oledIdle = cmd.idle; return { idle: demo.oledIdle };
    case 'mixer': {
      if (cmd.enabled != null) { demo.mixer.enabled = cmd.enabled; demo.mixer.running = cmd.enabled; }
      const p = cmd.patch || {}, cfg = demo.mixer.config;
      if (p.volume) channelCfg(cfg, p.volume[0]).volume = p.volume[1];
      if (p.mute) channelCfg(cfg, p.mute[0]).muted = p.mute[1];
      if (p.eq_preset) channelCfg(cfg, p.eq_preset[0]).eq.preset = p.eq_preset[1];
      if (p.eq_gains) { const eq = channelCfg(cfg, p.eq_gains[0]).eq; eq.bands.forEach((b, i) => b.gain = p.eq_gains[1][i]); eq.preset = null; }
      if (p.streamer != null) cfg.streamer.enabled = p.streamer;
      if (p.noise_suppression != null) cfg.mic.noise_suppression.enabled = p.noise_suppression;
      if (p.route) { cfg.routing.rules = cfg.routing.rules.filter(r => r.pattern !== p.route.pattern); cfg.routing.rules.unshift(p.route); }
      if (p.unroute) cfg.routing.rules = cfg.routing.rules.filter(r => r.pattern !== p.unroute);
      return demo.mixer;
    }
    case 'bindings': return { profile: 'FPS', bindings: { bindings: demo.bindings }, running: true, error: null };
    case 'bind': demo.bindings = demo.bindings.filter(b => b.source !== cmd.binding.source); demo.bindings.push(cmd.binding); return { profile: 'FPS' };
    case 'unbind': demo.bindings = demo.bindings.filter(b => b.source !== cmd.source); return { profile: 'FPS' };
    case 'macro_record': await new Promise(r => setTimeout(r, 800)); return { steps: [{ tap: 'KEY_G' }, { delay: 40 }, { tap: 'KEY_G' }] };
    case 'moments_status': return demo.moments;
    case 'moments_enable': demo.moments.enabled = cmd.enabled; demo.moments.recording = cmd.enabled; if (cmd.replay_seconds) demo.moments.replay_seconds = cmd.replay_seconds; return demo.moments;
    case 'moments_save': return { saved_to: demo.moments.output_dir };
    default: throw new Error(`demo: ${cmd.cmd} not simulated`);
  }
}
